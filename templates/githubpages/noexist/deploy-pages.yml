# Install the committed dependencies, build and verify the required site files,
# then upload and publish the Pages artifact.
# Run type checks, lint, unit and browser tests, font checks, audits, and
# dependency updates locally before pushing.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Update this after local maintenance validates a newer Node major.
          node-version: 26
          cache: npm
      - run: npm ci --no-audit
      - run: ./build_github_pages.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish Pages artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
